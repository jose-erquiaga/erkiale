<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Grey left panel -->
  <rect x="3" y="2" width="26" height="60" rx="2" fill="#cccccc"/>
  <!-- Blue right panel -->
  <rect x="31" y="2" width="30" height="60" rx="2" fill="#1e3a8a"/>
  <!-- E letter (white on grey) -->
  <rect x="6" y="8" width="4" height="48" fill="white"/>
  <rect x="6" y="8" width="18" height="6" fill="white"/>
  <rect x="6" y="28" width="13" height="5" fill="white"/>
  <rect x="6" y="50" width="18" height="6" fill="white"/>
  <!-- H letter (white on blue) -->
  <rect x="34" y="8" width="4" height="48" fill="white"/>
  <rect x="52" y="8" width="4" height="48" fill="white"/>
  <rect x="34" y="28" width="22" height="5" fill="white"/>
  <!-- Corner brackets -->
  <polyline points="1,10 1,1 10,1" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="square"/>
  <polyline points="1,54 1,63 10,63" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="square"/>
  <polyline points="63,10 63,1 54,1" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="square"/>
  <polyline points="63,54 63,63 54,63" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="square"/>
</svg>
